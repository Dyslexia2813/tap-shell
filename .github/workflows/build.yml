name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      # Иконка: icons/<flavor>.png из репозитория, иначе скачивается с сайта.
      - name: Generate launcher icons
        run: |
          mkdir -p build
          while read flavor site; do
            icon="build/$flavor-icon.png"
            if [ -f "icons/$flavor.png" ]; then
              cp "icons/$flavor.png" "$icon"
              echo "$flavor: using icons/$flavor.png"
            else
              python tools/fetch_icon.py "$site" "$icon" || echo "::warning::$flavor: could not download the site icon"
            fi
            python tools/make_icons.py "$icon" "app/src/$flavor/res"
          done <<'LIST'
          deeix https://tap.teamdream.online/
          allhands https://app.all-hands.dev/
          LIST

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: |
          set -o pipefail
          if ! gradle --no-daemon --console=plain :app:assembleRelease 2>&1 | tee build.log; then
            msg=$(grep -E "error:|e: |FAILED|What went wrong|Execution failed|Caused by|AAPT|Could not|not found" -A2 build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg}"
            exit 1
          fi

      - name: Name the APKs
        run: |
          cp app/build/outputs/apk/deeix/release/app-deeix-release.apk deeix-ru.apk
          cp app/build/outputs/apk/allhands/release/app-allhands-release.apk openhands.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            deeix-ru.apk
            openhands.apk

      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest deeix-ru.apk openhands.apk \
            --target "${{ github.sha }}" \
            --title "Web wrappers (latest)" \
            --notes "Build #${{ github.run_number }}: DEEIX-RU (tap.teamdream.online) and OpenHands (app.all-hands.dev)"
