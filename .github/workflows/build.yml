name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Get site icon
        run: |
          mkdir -p build
          if [ -f icon.png ]; then
            cp icon.png build/site-icon.png
            echo "Using icon.png from the repo"
          else
            python tools/fetch_icon.py build/site-icon.png || echo "::warning::Could not download the site icon"
          fi

      - name: Generate launcher icons
        run: python tools/make_icons.py build/site-icon.png app/src/main/res

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: gradle --no-daemon :app:assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk tap-shell.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tap-shell
          path: tap-shell.apk

      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest tap-shell.apk \
            --target "${{ github.sha }}" \
            --title "Tap-Shell (latest)" \
            --notes "Build #${{ github.run_number }}"
