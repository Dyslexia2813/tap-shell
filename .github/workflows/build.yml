name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Get site icon
        run: |
          mkdir -p build
          if [ -f icon.png ]; then
            cp icon.png build/site-icon.png
            echo "Using icon.png from the repo"
          else
            python tools/fetch_icon.py build/site-icon.png || echo "::warning::Could not download the site icon"
          fi

      - name: Generate launcher icons
        run: python tools/make_icons.py build/site-icon.png app/src/main/res

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        run: |
          set -o pipefail
          if ! gradle --no-daemon --console=plain :app:assembleRelease 2>&1 | tee build.log; then
            msg=$(grep -E "error:|e: |FAILED|What went wrong|Execution failed|Caused by|AAPT|Could not|not found" -A2 build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg}"
            exit 1
          fi

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk deeix-ru.apk

      - uses: actions/upload-artifact@v4
        with:
          name: deeix-ru
          path: deeix-ru.apk

      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest deeix-ru.apk \
            --target "${{ github.sha }}" \
            --title "DEEIX-RU (latest)" \
            --notes "Build #${{ github.run_number }}"
